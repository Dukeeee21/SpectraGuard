services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spectraguard}
      POSTGRES_USER: ${POSTGRES_USER:-spectraguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host 5433 -> contenedor 5432: en esta máquina el 5432 ya lo ocupa
      # un PostgreSQL nativo de Windows ajeno a este proyecto.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spectraguard_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro de la red de Docker, la base de datos se resuelve por nombre
      # de servicio ("db") y por su puerto interno (5432), sin importar a
      # qué puerto del host esté mapeado hacia afuera.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ml/weights:/app/ml/weights   # pesos del modelo (no se reconstruyen en cada build)
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "5173:80"

volumes:
  postgres_data:
  media_data:
  static_data:
